name: Debug APK (Phase A)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/debug-apk.yml"

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed debug APK with Gradle
        run: ./gradlew assembleStandardDebug

      - name: Upload arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-arm64-v8a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-universal-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk
          if-no-files-found: error
